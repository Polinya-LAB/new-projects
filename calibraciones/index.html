<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibration Plan · Laboratorio Polinyà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same tokens and components as Control de ensayos. Status = colour; the annual plan replaces the hand-painted Excel Gantt. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#E4ECEE; --fg:#12242B; --muted:#566C74; --line:#CFDCE0;
  --accent:#0A6C7C; --accent-ink:#FFFFFF; --accent-soft:#D3EAEE;
  --ok:#2D7F55; --ok-soft:#D8EEE1; --warn:#A8690A; --warn-soft:#F7E8CC; --crit:#B8322B; --crit-soft:#F6D9D6;
  --st-plan:#3866AE; --st-inf:#80539F; --st-canc:#98A6AC; --st-noap:#9A5A1E;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161A; --surface:#142026; --surface-2:#1B2A31; --fg:#E1EBEE; --muted:#90A4AC; --line:#293B43;
  --accent:#43B4C4; --accent-ink:#04232A; --accent-soft:#123840;
  --ok:#55C28D; --ok-soft:#163626; --warn:#E3A43A; --warn-soft:#3A2D14; --crit:#EF6A60; --crit-soft:#41201E;
  --st-plan:#6C9BE0; --st-inf:#B48AD6; --st-canc:#5E6E75; --st-noap:#D99A5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161A; --surface:#142026; --surface-2:#1B2A31; --fg:#E1EBEE; --muted:#90A4AC; --line:#293B43;
  --accent:#43B4C4; --accent-ink:#04232A; --accent-soft:#123840;
  --ok:#55C28D; --ok-soft:#163626; --warn:#E3A43A; --warn-soft:#3A2D14; --crit:#EF6A60; --crit-soft:#41201E;
  --st-plan:#6C9BE0; --st-inf:#B48AD6; --st-canc:#5E6E75; --st-noap:#D99A5B; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
a{color:var(--accent)}
.mono,.ref{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;margin-right:auto}
.brand .row1{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.01em}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 5px}
.home{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:block;margin-bottom:2px}
.home:hover{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--fg)}
.tabs .n{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--muted)}
.tabs .n.crit{background:var(--crit-soft);color:var(--crit)} .tabs .n.warn{background:var(--warn-soft);color:var(--warn)}
.gh{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.gh:hover{border-color:var(--accent)}
.gh i{width:8px;height:8px;border-radius:50%;background:var(--st-canc)}
.gh.on i{background:var(--ok)} .gh.bad i{background:var(--crit)} .gh.busy i{background:var(--warn)}
.gh.on{color:var(--fg)}
/* Read-only (not connected, or no write access): editing controls are hidden. */
body.ro :is([data-act="eq-new"],[data-act="cal-new"],[data-act="cal-plan"],[data-act="ev-new"],[data-act="mt-new"],[data-act="note-done"],[data-act="settings"],[data-act="pt-add"],[data-act="pt-del"],[data-act="res-add"],[data-act="cert-reg"],[data-act="res-del"],[data-act="del"],[data-act="do-import"],[data-dz]){display:none!important}
body.ro .dlg-f button[type="submit"]:not(.gh-ok){display:none}
body.ro :is(input[data-tog],select[data-tol]){pointer-events:none;opacity:.6}

main{max-width:1500px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--warn);border-radius:var(--r);padding:10px 14px}
.banner.crit{border-left-color:var(--crit)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.icon-btn{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
.panel-h h2{font-size:19px;margin-right:auto}
.panel-h h3{font-size:16px;margin-right:auto}
.view-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.view-h h2{font-size:26px;margin-right:auto}
.fgrp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fgrp .fl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.fc:hover{border-color:var(--accent);color:var(--fg)}
.fc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fc small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.filters.multi{flex-direction:column;align-items:flex-start;gap:8px}
.search,.fsel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0;max-width:100%}
.search{width:240px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)} .kpi.inf b{color:var(--st-inf)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Alerts */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--warn);cursor:pointer}
.alerts li.crit{border-left-color:var(--crit)}
.alerts li.inf{border-left-color:var(--st-inf)}
.alerts li:hover{outline:1px solid var(--line)}
.alerts .what b{font-family:var(--f-mono);font-size:12px;margin-right:6px}
.alerts .what small{display:block;color:var(--muted);font-size:13px}
.sev{font-family:var(--f-mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.crit .sev,.sev.crit{background:var(--crit-soft);color:var(--crit)}
.inf .sev{background:color-mix(in srgb,var(--st-inf) 15%,var(--surface));color:var(--st-inf)}
.empty-ok{padding:14px;border-radius:var(--r);background:var(--surface-2);color:var(--muted)}

/* Upcoming months */
.months{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ml{font-family:var(--f-display);font-weight:700;font-size:16px}
.mrow .ml small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.mrow.late .ml{color:var(--crit)}
.labgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:4px}
.labgrp .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.codebtn{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--fg)}
.codebtn:hover{border-color:var(--accent)}
.codebtn.plan{border-color:var(--st-plan);color:var(--st-plan)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid currentColor;color:var(--st)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-valid{--st:var(--ok)} .k-soon,.k-nodata{--st:var(--warn)} .k-overdue,.k-nok{--st:var(--crit)} .k-pending{--st:var(--st-inf)}
.k-beforeuse{--st:var(--st-plan)} .k-notreq,.k-reserved,.k-retired,.k-none{--st:var(--st-canc)} .k-oos{--st:var(--st-noap)}
.res{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.res.OK{background:var(--ok-soft);color:var(--ok)} .res.NOK{background:var(--crit-soft);color:var(--crit)} .res.NA{background:var(--surface-2);color:var(--muted)}
.chip{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--surface-2);font-family:var(--f-mono);white-space:nowrap}
.iss{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.iss.info{background:var(--surface-2);color:var(--muted)}
.tick{color:var(--ok);font-weight:700} .cross{color:var(--muted)}

/* Tables */
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .nowrap{white-space:nowrap}
.tbl .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tbl.mini{font-size:13px} .tbl.mini td,.tbl.mini th{padding:5px 6px}
.tbl tr.off td{color:var(--muted)}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.th-sort:hover{color:var(--fg)}
.th-sort .arr{font-size:9px;opacity:.35}
.th-sort[aria-sort] .arr{opacity:1;color:var(--accent)}
.code{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap}
.folder{font-size:12px;text-decoration:none;white-space:nowrap}
.cell-sel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:2px 4px;font-size:13px}
.due.crit{color:var(--crit);font-weight:600} .due.warn{color:var(--warn);font-weight:600}

/* Annual plan */
.pg-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.zoom button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pg-wrap{overflow:auto;max-height:calc(100dvh - 250px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pg{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.pg th,.pg td{border-bottom:1px solid var(--line);padding:0}
.pg thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500;padding:5px 0;text-align:center;line-height:1.15}
.pg thead th small{display:block;font-size:9px}
.pg thead th.now{background:var(--accent);color:var(--accent-ink)}
.pg .rh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:4px 10px;min-width:240px;max-width:260px;border-right:1px solid var(--line);font-family:var(--f-body)}
.pg thead .rh{z-index:3}
.pg .rh button{all:unset;cursor:pointer;display:block;width:100%}
.pg .rh b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.pg .rh .d{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.pg .rh .pill{font-size:11px;padding:0 6px;margin-left:4px}
.pg .rh.crit{box-shadow:inset 4px 0 0 var(--crit)} .pg .rh.warn{box-shadow:inset 4px 0 0 var(--warn)}
.pg td.m{width:36px;min-width:36px;height:36px;text-align:center;cursor:pointer;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.pg td.m:hover{background:var(--surface-2)}
.pg .jan{border-left:2px solid var(--line)!important}
.pg td.now{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.pg .sec th{background:var(--surface-2);text-align:left;padding:5px 0;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pg .sec th span{position:sticky;left:10px;padding-left:10px}
.pg tfoot th,.pg tfoot td{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:5px 0;background:var(--surface-2)}
.pg tfoot .rh{background:var(--surface-2);font-size:12px;font-weight:600}
.mk{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:4px;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.mk.due{box-shadow:inset 0 0 0 2px var(--crit);color:var(--crit)}
.mk.due.late{background:var(--crit);color:#fff}
.mk.proj{opacity:.45}
.mk.plan{background:var(--st-plan);color:#fff}
.mk.done{background:var(--ok);color:#fff}
.mk.done.open{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.mk.plan.due,.mk.done.due{box-shadow:inset 0 0 0 2px var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend .mk{width:22px;height:18px;font-size:11px;margin-right:4px;vertical-align:middle}

/* Review */
.rev-sum{display:flex;flex-wrap:wrap;gap:6px}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2::before{content:'▸ ';color:var(--muted)}
details.panel[open]>summary h2::before{content:'▾ '}
details.panel:not([open])>summary{margin-bottom:0}
.rev-sum a{text-decoration:none}
.rev-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rev-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--r);background:var(--surface-2)}

/* Import */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:10px 12px 10px 44px;position:relative;background:var(--surface-2);border-radius:var(--r);font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.drop-zone{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:var(--r);padding:24px 16px;cursor:pointer;background:var(--surface);position:relative}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone input{position:absolute;width:1px;height:1px;opacity:0}
.imp-sum{display:flex;flex-wrap:wrap;gap:8px}
.tag-st{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.tag-st.new{background:var(--accent-soft);color:var(--accent)} .tag-st.update{background:var(--warn-soft);color:var(--warn)} .tag-st.same{background:var(--surface-2);color:var(--muted)}

/* Forms & dialog */
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.field input:not([type="checkbox"]),.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.field.req label::after{content:" *";color:var(--crit)}
.field .help{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);font-weight:400}
dialog{border:0;border-radius:10px;padding:0;background:var(--surface);color:var(--fg);width:min(980px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.narrow{width:min(640px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,20,24,.55)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:22px}
.dlg-body{padding:14px 18px;overflow-y:auto;display:grid;gap:14px}
.dlg-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;min-width:0}

/* Validation sheet: a controlled Fluidra document (paper colours in both themes), printable to PDF.
   Brand: navy #11156D and blue #5184E4 from the Fluidra · Polinyà Design Center logo; Tahoma body and Arial headings as in the QTP template.
   Chart series: 2026 #3A45B5 (filled marker), 2025 #5184E4 (hollow marker), validated for colour-vision deficiency. */
.sheet{--ink:#1A1A1A;--navy:#11156D;--c26:#3A45B5;--c25:#5184E4;--rule:#C9CCD8;--soft:#F2F3F8;--okc:#1E7A46;--okbg:#E3F2E8;--wc:#8A5A00;--wbg:#FBF0D9;--nc:#A8231B;--nbg:#F8E1DE;--gc:#5B6272;
  background:#fff;color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:12.5px;line-height:1.4;max-width:1040px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.08)}

.sheet .dh{display:grid;grid-template-columns:190px 1fr auto;align-items:center;border-bottom:2px solid var(--navy);padding:14px 22px 10px;gap:16px}

.sheet .sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.sheet .sig div{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;min-height:58px}
.sheet .sig dt{font-size:10.5px;color:var(--gc);text-transform:uppercase} .sheet .sig dd{margin:2px 0 0;font-weight:700}
.sheet .iso{columns:2;column-gap:28px;font-size:11px;margin:0;padding-left:16px}

@media (max-width:760px){.sheet .dh{grid-template-columns:1fr}.sheet .dh .meta{text-align:left}.sheet .kv{grid-template-columns:1fr 1fr}.sheet .rules,.sheet .sig{grid-template-columns:1fr}.sheet .iso{columns:1}.sheet .db{padding:12px}}
/* On screen the document table is plain blocks so wide tables scroll inside .tw; in print it stays a table so header and footer repeat on every page. */
@media screen{.sheet .doc{display:flex;flex-direction:column}.sheet .doc>*,.sheet .doc>*>tr,.sheet .doc>*>tr>td{display:block;min-width:0}.sheet .doc>tfoot{order:2}}
main{grid-template-columns:minmax(0,1fr)}  /* the sheet's wide tables scroll inside it instead of widening the page */
@page{size:A4;margin:10mm 9mm 12mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font:9px Arial,sans-serif;color:#5B6272}}
@media print{
  :root{color-scheme:light}
  body{background:#fff}
  .top,#toast,.no-print,.banner,dialog{display:none!important}

  .sheet table.t{font-size:9.5px} .sheet table.t th{font-size:8.5px} .sheet table.t td,.sheet table.t th{padding:3px 4px}
  .sheet .tw{overflow:visible}
  .sheet h3,.sheet table.t tr,.sheet .chart,.sheet .rules,.sheet .sig,.sheet .concl{break-inside:avoid}
  .sheet h3{break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>/* Local test mode (development only): opened as a file or with ?local, the page loads local-data.js, which is not in the
   repository, and keeps changes in this browser instead of saving them to GitHub. */
if(location.protocol==='file:'||/[?&]local\b/.test(location.search)) document.write('<script src="local-data.js"><\/script>');</script>
<script>
/* ---------- Constants ---------- */
const GROUPS=['Test equipment','Auxiliary equipment'];
const MODES=['Periodic','Expiry date','Before use','Not required'];
const STATES=['In use','Out of service','Retired','Reserved'];
const VIEWS=[['overview','Overview'],['equipment','Equipment'],['plan','Annual plan'],['calibrations','Calibrations'],['evaluation','TU evaluation'],['sheets','Validation sheets'],['maintenance','Maintenance'],['review','Data review'],['data','Import & data']];
/* Test standards a chamber can be validated for: tolerance per quantity and the test conditions (severities) the calibration must cover.
   T:'cold' = any point ≤ 0 ºC, 'heat' = any point > 30 ºC, 'ends' = lowest and highest point; ramp = rate of change, not verifiable at fixed points. */
const STANDARDS={
  'ISO 9227':{title:'Salt spray tests (NSS, AASS, CASS)',tol:{T:2},sev:[{label:'NSS / AASS · 35 ºC',T:35},{label:'CASS · 50 ºC',T:50,optional:true}]},
  'IEC 60068-2-1':{title:'Test A: Cold',tol:{T:2},sev:[{label:'Cold severities (≤ 0 ºC)',T:'cold'}]},
  'IEC 60068-2-2':{title:'Test B: Dry heat',tol:{T:2},sev:[{label:'Dry heat severities (> 30 ºC)',T:'heat'}]},
  'IEC 60068-2-14 Nb':{title:'Test Nb: Change of temperature, specified rate',tol:{T:2},sev:[{label:'Lower and upper temperatures',T:'ends'},{label:'Rate of change (1, 3 or 5 K/min ± 20 %)',ramp:true}]},
  'IEC 60068-2-78':{title:'Test Cab: Damp heat, steady state',tol:{T:2,RH:3},sev:[{label:'40 ºC / 93 %RH',T:40,RH:93}]},
  'IEC 60068-2-30':{title:'Test Db: Damp heat, cyclic',tol:{T:2,RH:3},sev:[{label:'Upper phase 40 ºC / 93 %RH',T:40,RH:93},{label:'Upper phase 55 ºC / 93 %RH (variant 2)',T:55,RH:93,optional:true},{label:'Lower phase 25 ºC / ≥ 95 %RH',T:25,RH:95}]},
};
const QU={T:'ºC',RH:'%RH'};
const V_RANK={ok:0,corr:1,b:2,nok:3,na:4};
const V_LABEL={ok:'Conforming',corr:'Conforming with correction',b:'Simple acceptance only',nok:'Not conforming',na:'Not calibrated'};
const DEFAULT_CFG={warnMonths:2,
  certBase:'https://fluidra.sharepoint.com/sites/127-RDCenterPolinya-SPO2/Shared%20Documents/07.%20Laboratory/4.%20Equipment/2.%20Calibration/',
  certPath:'0.%20Certificados/Equipos/{code}/Actuales',formCode:'F-IM-FM-001',formRev:'rev.1 · 16/04/2026'};
const CAL_LABEL={valid:'Valid',soon:'Due soon',overdue:'Overdue',nok:'Out of tolerance',pending:'Pending closure',nodata:'Dates missing',
  notreq:'Not required',beforeuse:'Check before use',reserved:'Reserved code',retired:'Retired',oos:'Out of service',none:'No plan'};
const ACTION_KEYS=['overdue','nok','soon','pending','nodata'];
const OFF_KEYS=['notreq','beforeuse','reserved','retired','oos'];
const KEY_RANK={overdue:0,nok:1,soon:2,pending:3,nodata:4,valid:5,beforeuse:6,notreq:7,oos:8,retired:9,reserved:10};
const ISSUE={certnoreg:'Certificate in SharePoint not registered',dupcode:'Duplicated inventory code',dupserial:'Serial number shared with other equipment',nextdiff:'Next date does not match last + period',
  nextbefore:'Next date not after the last calibration',lastfuture:'Last calibration in the future',noperiod:'Calibration period missing',nodates:'Last calibration missing',
  plannedpast:'Planned month already passed',import:'Notes from the Excel import',tudiff:'TU differs from the plan tolerance',notol:'Tolerance missing',
  noserial:'Serial number missing',nolab:'Calibration lab to be defined',noprice:'Offer price to be defined',noenac:'ENAC accreditation to be defined'};
const ISSUE_WARN=new Set(['certnoreg','dupcode','dupserial','nextdiff','nextbefore','lastfuture','noperiod','nodates','plannedpast','import']);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_EN=['january','february','march','april','may','june','july','august','september','october','november','december'];
const COLS=['equipment','calibrations','evaluations','maintenance','config'];
const MT_TYPES=['Preventive','Corrective','Verification'];

/* ---------- State ---------- */
const S={view:'overview',q:'',cfg:{...DEFAULT_CFG},f:{group:[],status:[],lab:[]},sort:{eq:{k:'code',dir:1}},
  plan:{start:null,span:24,all:false},calf:{status:[],year:[]},imp:null,load:null,sheet:null};
try{const v=localStorage.getItem('cal.view'); if(VIEWS.some(x=>x[0]===v)) S.view=v; const sp=+localStorage.getItem('cal.span'); if(sp===12||sp===24) S.plan.span=sp;}catch(e){}
if(location.hash&&VIEWS.some(x=>'#'+x[0]===location.hash)) S.view=location.hash.slice(1);
let DATA=null, IX=null;

/* ---------- Utilities ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const slug=s=>String(s||'').trim().replace(/[^A-Za-z0-9_-]+/g,'_').slice(0,60);
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');
const nowIso=()=>new Date().toISOString();
const todayIso=()=>{const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
/* Calibrations are planned by month, as in the Excel. A month is "YYYY-MM"; a calibration is valid until the end of its due month. */
const mIdx=s=>{const m=/^(\d{4})-(\d{2})$/.exec(s||''); return m?(+m[1])*12+(+m[2]-1):null};
const mStr=i=>`${Math.floor(i/12)}-${pad(i%12+1)}`;
const addM=(s,n)=>{const i=mIdx(s); return i==null||!n?'':mStr(i+ +n)};
const nowIdx=()=>{const d=new Date(); return d.getFullYear()*12+d.getMonth()};
const fmtM=s=>{const i=mIdx(s); return i==null?'—':`${pad(i%12+1)}/${Math.floor(i/12)}`};
const fmtML=s=>{const i=mIdx(s); return i==null?'—':`${MN[i%12]} ${Math.floor(i/12)}`};
const fmtD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?`${m[3]}/${m[2]}/${m[1]}`:'—'};
const num=v=>{if(v==null||v==='') return null; if(typeof v==='number') return isFinite(v)?v:null; const m=String(v).replace(',','.').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null};
const fmtNum=v=>v==null||v===''?'—':(+v).toLocaleString('en-GB',{maximumFractionDigits:3});
const money=v=>v==null||v===''?'—':`${Math.round(+v).toLocaleString('en-GB')} €`;
const perLabel=p=>!p?'—':p%12===0?`${p/12} year${p>12?'s':''}`:`${p} months`;
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const byCode=(a,b)=>String(a.code||'').localeCompare(String(b.code||''),'en',{numeric:true})||String(a.id).localeCompare(String(b.id));
const normSerial=s=>String(s||'').replace(/\(.*?\)/g,'').replace(/\s+/g,'').toUpperCase();
const tolNum=e=>{for(const p of e.points||[]){const m=String(p.tolerance||'').match(/±\s*(\d+(?:[.,]\d+)?)/); if(m) return parseFloat(m[1].replace(',','.'));} return null};
function toast(msg){const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,4200)}
const certLink=e=>e.certUrl||(S.cfg.certBase+String(S.cfg.certPath||'').replace('{code}',encodeURIComponent(e.code||'')));
const eqById=id=>IX&&IX.byId.get(id);
const eqLabel=e=>e?`${e.code} · ${e.description||'(no description)'}`:'(deleted equipment)';

/* ---------- Domain ---------- */
const isClosed=c=>c.status==='Done'&&!!c.certificate&&c.inTolerance==='Yes'&&!!c.label;
const missingClosure=c=>[!c.certificate&&'certificate not received',c.inTolerance!=='Yes'&&(c.inTolerance==='No'?'out of tolerance':'tolerance not checked'),!c.label&&'label not placed'].filter(Boolean);
function dueOf(e){
  if(e.calMode==='Expiry date') return e.nextOverride||'';
  if(e.calMode!=='Periodic') return '';
  return e.nextOverride||addM(e.lastCal,+e.periodMonths||0);
}
function calInfo(e){
  const st=e.state||'In use';
  if(st==='Reserved') return {key:'reserved'}; if(st==='Retired') return {key:'retired'}; if(st==='Out of service') return {key:'oos'};
  if(e.calMode==='Not required') return {key:'notreq'}; if(e.calMode==='Before use') return {key:'beforeuse'};
  const recs=IX.recs.get(e.id)||[], done=recs.filter(c=>c.status==='Done'), lastRec=done[done.length-1]||null;
  const planned=recs.find(c=>c.status==='Planned')||null;
  const due=dueOf(e), di=mIdx(due), n=nowIdx(), warn=+S.cfg.warnMonths||0;
  const base={due,lastRec,planned,months:di==null?null:di-n};
  if(di==null) return {...base,key:'nodata'};
  if(n>di) return {...base,key:'overdue'};
  if(lastRec&&lastRec.inTolerance==='No') return {...base,key:'nok'};
  if(di-n<=warn) return {...base,key:'soon'};
  if(lastRec&&!isClosed(lastRec)) return {...base,key:'pending'};
  return {...base,key:'valid'};
}
const calLabel=(e,i)=>e.calMode==='Expiry date'&&i.key==='overdue'?'Expired':e.calMode==='Expiry date'&&i.key==='soon'?'Expires soon':i.key==='soon'&&i.months===0?'Due this month':CAL_LABEL[i.key];
const sevOf=k=>['overdue','nok'].includes(k)?'crit':k==='pending'?'inf':['soon','nodata'].includes(k)?'warn':'';
function maintInfo(e){
  const m=e.maint||{};
  if(!m.required||['Reserved','Retired'].includes(e.state)) return {key:'none'};
  const due=m.last&&+m.periodMonths?addM(m.last,+m.periodMonths):'', di=mIdx(due), n=nowIdx();
  if(di==null) return {key:'nodata',due};
  if(n>di) return {key:'overdue',due,months:di-n};
  if(di-n<=(+S.cfg.warnMonths||0)) return {key:'soon',due,months:di-n};
  return {key:'valid',due,months:di-n};
}
function evalCalc(v){
  const sp=num(v.setpoint), ob=num(v.obtained), U=num(v.uncertainty), tu=num(v.tu);
  const e=sp!=null&&ob!=null?ob-sp:num(v.error);
  const eu=e!=null&&U!=null?Math.abs(e)+U:null;
  return {e,U,tu,eu,res:eu!=null&&tu!=null?(eu<=tu+1e-9?'OK':'NOK'):''};
}
function issuesOf(e){
  const out=[], add=(type,text)=>out.push({type,sev:ISSUE_WARN.has(type)?'warn':'info',text});
  const info=IX.info.get(e.id), active=!['Reserved','Retired'].includes(e.state||'In use');

/* Certificates copied from SharePoint (lab-data/calibraciones/certificados.json, written by the scheduled sync; read only here).

const SP_Q=new Set(['T','RH']);
function linkCerts(){
  IX.certs=new Map(); IX.certFree=new Map(); IX.certByRec=new Map();
  const list=Object.entries(CERTS||{}).map(([k,c])=>({key:k,...c})).filter(c=>c.equipmentId&&IX.byId.has(c.equipmentId)).sort((a,b)=>String(a.calDate||'').localeCompare(String(b.calDate||'')));
  for(const ct of list){
    (IX.certs.get(ct.equipmentId)||IX.certs.set(ct.equipmentId,[]).get(ct.equipmentId)).push(ct);
    const done=(IX.recs.get(ct.equipmentId)||[]).filter(c=>c.status==='Done'&&!IX.certByRec.has(c.id)), cm=mIdx(String(ct.calDate||'').slice(0,7));
    let rec=ct.certRef?done.find(c=>c.certRef&&c.certRef.trim()===ct.certRef):null;
    if(!rec&&cm!=null){let best=null; for(const c of done){const d=Math.abs(mIdx(c.month)-cm); if(d<=3&&(!best||d<best.d)) best={c,d};} rec=best&&best.c;}
    if(!rec){(IX.certFree.get(ct.equipmentId)||IX.certFree.set(ct.equipmentId,[]).get(ct.equipmentId)).push(ct); continue;}
    IX.certByRec.set(rec.id,ct); ct.recId=rec.id;
    const pts=(ct.points||[]).filter(p=>SP_Q.has(p.q));
    if(!(rec.results||[]).length&&pts.length){rec.results=pts.map(p=>({q:p.q,nominal:p.nominal,atT:p.atT??null,mean:p.mean,U:p.U,stab:p.stab??null,unif:p.unif??null,zones:p.zones||[]})); rec.resultsFrom='sharepoint'; if(!rec.zonesN) rec.zonesN=ct.zonesN||'';}
    if(!rec.certRef) rec.certRef=ct.certRef||'';

}
const certA=ct=>ct?`<a class="folder" href="${esc(ct.url||'#')}" target="_blank" rel="noopener" title="Open the certificate in SharePoint">📄 ${esc(ct.certRef||ct.file||'Certificate')}</a>`:'';
function certPoints(ct){
  const pts=ct.points||[]; if(!pts.length) return `<p class="note">${esc(ct.notes||'No results were read from this certificate.')}</p>`;

function buildIndex(){
  const eqs=Object.entries(DATA.equipment).map(([id,v])=>({id,...v})).sort(byCode);
  const recs=new Map(), evals=new Map(), logs=new Map(), code=new Map(), serial=new Map();
  const push=(m,k,v)=>{if(!m.has(k)) m.set(k,[]); m.get(k).push(v)};
  for(const [id,c] of Object.entries(DATA.calibrations)) push(recs,c.equipmentId,{id,...c});
  for(const l of recs.values()) l.sort((a,b)=>String(a.month).localeCompare(String(b.month))||(a.status==='Done'?-1:1));
  for(const [id,v] of Object.entries(DATA.evaluations)) push(evals,v.equipmentId,{id,...v});
  for(const [id,v] of Object.entries(DATA.maintenance)) push(logs,v.equipmentId,{id,...v});
  for(const e of eqs){ const k=norm(e.code); if(k) push(code,k,e); const s=normSerial(e.serial); if(s) push(serial,s,e); }
  IX={eqs,byId:new Map(eqs.map(e=>[e.id,e])),recs,evals,logs,code,serial,info:new Map(),maint:new Map(),issues:new Map()};
  linkCerts();
  for(const e of eqs){IX.info.set(e.id,calInfo(e)); IX.maint.set(e.id,maintInfo(e));}
  for(const e of eqs) IX.issues.set(e.id,issuesOf(e));
  IX.labs=[...new Set(eqs.map(e=>e.lab).filter(Boolean))].sort();
}

/* ---------- Validation sheets ----------
   One controlled sheet per chamber: the last two certificates compared point by point against the tolerance of the test standards it is used for.
   e = mean − nominal; drift = how much |e| grew since the previous certificate (0 if it decreased).
   Rule A (guard band, ILAC-G8): |e| + U ≤ TU.  Rule B (simple acceptance): |e| ≤ TU.
   With a setpoint correction of −e (ISO/IEC 17025 §6.4.11) the error expected until the next calibration is the drift, so A becomes U + drift ≤ TU. */
const DRIFT_WARN=0.25;  // drift above this share of TU asks for intermediate checks or a shorter interval
const EPS=1e-9;
const fx=(v,d=2)=>v==null||!isFinite(v)?'—':(v<0?'−':'')+Math.abs(v).toFixed(d);
const fsg=(v,d=2)=>v==null||!isFinite(v)?'—':(v>0?'+':v<0?'−':'±')+Math.abs(v).toFixed(d);
const yearOf=c=>c?String(c.month||'').slice(0,4):'';
function planTol(e,q){
  const re=q==='RH'?/±\s*(\d+(?:[.,]\d+)?)\s*%\s*(?:RH|HR)/i:/±\s*(\d+(?:[.,]\d+)?)\s*(?:º|°)\s*C/i;
  for(const p of e.points||[]){const m=String(p.tolerance||'').match(re); if(m) return parseFloat(m[1].replace(',','.'));}
  return null;
}
/* TU of a quantity: the tightest tolerance among the standards the equipment is used for; without standards, the plan tolerance. */
function eqTU(e,q){
  const tols=((e.validation||{}).standards||[]).map(k=>STANDARDS[k]).filter(s=>s&&s.tol[q]!=null).map(s=>s.tol[q]);
  if(tols.length) return {tu:Math.min(...tols),src:'standard'};
  const p=planTol(e,q); return {tu:p,src:p==null?'':'plan'};
}
const ptKey=r=>r.q==='RH'?`RH${num(r.nominal)}@${num(r.atT)}`:`T${num(r.nominal)}`;
const ptLabel=r=>r.q==='RH'?`${fmtNum(num(r.nominal))} %RH at ${fmtNum(num(r.atT))} ºC`:`${fmtNum(num(r.nominal))} ºC`;
function judge(x,T){
  if(T==null||x.e1==null||x.U==null) return {passA:false,passB:false,passC:false,v:'na'};
  const passA=x.A<=T+EPS, passB=Math.abs(x.e1)<=T+EPS, passC=x.C<=T+EPS;
  return {passA,passB,passC,v:passA?'ok':passC?'corr':passB?'b':'nok'};
}
function sheetData(e){
  const done=(IX.recs.get(e.id)||[]).filter(c=>c.status==='Done'&&(c.results||[]).length);
  const cur=done[done.length-1]||null, prev=done[done.length-2]||null;
  const stds=((e.validation||{}).standards||[]).filter(k=>STANDARDS[k]);
  const tu={T:eqTU(e,'T'),RH:eqTU(e,'RH')};
  const prevBy=new Map((prev?prev.results:[]).map(r=>[ptKey(r),r]));
  const rows=(cur?cur.results:[]).map(r=>{
    const nom=num(r.nominal), mean=num(r.mean), U=num(r.U), p=prevBy.get(ptKey(r)), pm=p?num(p.mean):null;
    const e1=mean!=null&&nom!=null?mean-nom:null, e0=pm!=null&&nom!=null?pm-nom:null;
    const drift=e1!=null&&e0!=null?Math.max(0,Math.abs(e1)-Math.abs(e0)):null;
    const x={r,q:r.q,key:ptKey(r),label:ptLabel(r),nom,atT:num(r.atT),e1,e0,drift,U,U0:p?num(p.U):null,
      A:e1!=null&&U!=null?Math.abs(e1)+U:null,C:U!=null?U+(drift||0):null,corr:e1==null?null:-e1,
      stab:num(r.stab),unif:num(r.unif),zones:(r.zones||[]).map(num),pz:p&&(p.zones||[]).length===(r.zones||[]).length?p.zones.map(num):[],hasPrev:!!p};  // positions are compared only when both certificates measured the same number
    x.T=tu[r.q].tu; Object.assign(x,judge(x,x.T));
    x.zOut=x.zones.map((z,i)=>z!=null&&x.T!=null&&Math.abs(z-nom)>x.T+EPS?i:-1).filter(i=>i>=0);
    return x;
  });
  const lost=prev?prev.results.filter(r=>!rows.some(x=>x.key===ptKey(r))):[];
  /* Severities each standard needs, matched to the calibrated points (±1 of the nominal). */
  const near=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<=1;
  const Tp=rows.filter(x=>x.q==='T'), Hp=rows.filter(x=>x.q==='RH');
  const lo=Tp.length?Math.min(...Tp.map(x=>x.nom)):null, hi=Tp.length?Math.max(...Tp.map(x=>x.nom)):null;
  const std=stds.map(k=>{
    const s=STANDARDS[k], sev=s.sev.map(v=>{
      if(v.ramp) return {...v,pts:[],missing:[],ramp:true};
      let pts=[], missing=[];
      if(v.T==='cold'){pts=Tp.filter(x=>x.nom<=0); if(!pts.length) missing.push('a point ≤ 0 ºC');}
      else if(v.T==='heat'){pts=Tp.filter(x=>x.nom>30); if(!pts.length) missing.push('a point > 30 ºC');}
      else if(v.T==='ends'){pts=Tp.filter(x=>x.nom===lo||x.nom===hi); if(pts.length<2) missing.push('the lowest and highest temperatures');}
      else{const t=Tp.find(x=>near(x.nom,v.T)); if(t) pts.push(t); else missing.push(`${v.T} ºC`);
        if(v.RH!=null){const h=Hp.find(x=>near(x.nom,v.RH)&&near(x.atT,v.T)); if(h) pts.push(h); else missing.push(`${v.RH} %RH at ${v.T} ºC`);}}
      return {...v,pts,missing};
    });
    const pts=[...new Set(sev.flatMap(v=>v.pts))].map(x=>({x,...judge(x,s.tol[x.q])}));
    const worst=pts.reduce((w,p)=>V_RANK[p.v]>V_RANK[w]?p.v:w,'ok');
    return {k,s,sev,pts,v:pts.length?worst:'na',allA:pts.length&&pts.every(p=>p.passA),allC:pts.length&&pts.every(p=>p.passA||p.passC),allB:pts.length&&pts.every(p=>p.passB),
      gaps:sev.filter(v=>v.missing.length&&!v.optional),optGaps:sev.filter(v=>v.missing.length&&v.optional),ramp:sev.some(v=>v.ramp)};
  });
  return {cur,prev,stds,tu,rows,lost,std,Tp,Hp,y1:yearOf(cur),y0:yearOf(prev)};
}
function sheetActions(e,d){
  const out=[], add=(text,ref)=>out.push({text,ref}), u=q=>QU[q], y0=d.y0||'previous';
  for(const x of d.rows.filter(x=>x.v==='corr')) add(`<b>${x.label}</b>: apply a setpoint correction of <b>${fsg(x.corr)} ${u(x.q)}</b> (set ${fx(x.nom+x.corr,2)} ${u(x.q)} to obtain ${fmtNum(x.nom)} ${u(x.q)}) and record it in the test instructions. Rule A is then met: U + drift = ${fx(x.C)} ≤ ${fmtNum(x.T)} ${u(x.q)}.`,'§6.4.11');
  for(const x of d.rows.filter(x=>x.v==='nok')) add(`<b>${x.label}</b> is out of tolerance even with a correction (|e| = ${fx(Math.abs(x.e1))}, U + drift = ${fx(x.C)} > ${fmtNum(x.T)} ${u(x.q)}). Do not use the chamber at this point; review the tests run since the last calibration.`,'§6.4.9 · §7.10');
  for(const x of d.rows.filter(x=>x.drift!=null&&x.T!=null&&x.drift>DRIFT_WARN*x.T+EPS)) add(`<b>${x.label}</b>: the error grew ${fx(x.drift)} ${u(x.q)} since ${y0} (more than ${DRIFT_WARN*100} % of TU). Add an intermediate check or shorten the calibration interval.`,'§6.4.7 · §6.4.10 · §8.5');
  for(const x of d.rows.filter(x=>x.zOut.length)){
    const pos=x.zOut.map(i=>{const again=x.pz[i]!=null&&Math.abs(x.pz[i]-x.nom)>x.T+EPS; return `P${i+1} at ${fx(x.zones[i])} ${u(x.q)} (e ${fsg(x.zones[i]-x.nom)})${again?`, also outside in ${y0} (${fx(x.pz[i])} ${u(x.q)}, e ${fsg(x.pz[i]-x.nom)})`:''}`;});
    add(`<b>${x.label}</b>: position ${pos.join('; ')} is outside ±${fmtNum(x.T)} ${u(x.q)}. Exclude it from the useful zone or check the air circulation and door seal; with the correction the mean is centred but the spread stays.`,'§6.4.5');
  }
  for(const q of ['T','RH']){const xs=d.rows.filter(x=>x.q===q&&x.T!=null&&x.U!=null&&x.U>=x.T-EPS);
    if(xs.length) add(`${q==='RH'?'Humidity':'Temperature'}: the certificate uncertainty (U up to ${fx(Math.max(...xs.map(x=>x.U)),1)} ${u(q)}) is not smaller than TU ±${fmtNum(xs[0].T)} ${u(q)}, so rule A cannot be met even after a correction. Decide the decision rule (simple acceptance, rule B, or a tolerance agreed with the test requester) or ask the lab for a lower-uncertainty method.`,'§7.1.3 · §7.8.6 · ILAC-G8');}
  const gap=new Map(); for(const s of d.std) for(const v of s.gaps) gap.set(`${s.k}|${v.label}`,{s,v});
  for(const {s,v} of gap.values()) add(`${esc(s.k)} · ${esc(v.label)}: not covered by the calibration (missing ${esc(v.missing.join(' and '))}). Add the point at the next calibration${IX.info.get(e.id).planned?` (planned ${fmtM(IX.info.get(e.id).planned.month)})`:''}, or do not use the chamber for this severity.`,'§6.4.6 · §6.4.7');
  if(d.std.some(s=>s.ramp)) add('IEC 60068-2-14 Nb: the rate of temperature change is not in the certificate. Verify it with a logged ramp before use (1, 3 or 5 K/min ± 20 %, measured in the useful zone).','§6.4.4 · §6.4.10');
  for(const q of ['T','RH']){const tp=planTol(e,q), ts=d.tu[q].tu; if(d.tu[q].src==='standard'&&tp!=null&&Math.abs(tp-ts)>EPS&&d.rows.some(x=>x.q===q)) add(`The plan tolerance for ${q==='RH'?'humidity':'temperature'} (±${fmtNum(tp)} ${u(q)}) is not the standards' tolerance (±${fmtNum(ts)} ${u(q)}). Use one acceptance criterion in the calibration plan.`,'§6.4.13');}

  const a=Math.floor(lo/st)*st, b=Math.ceil(hi/st)*st, out=[]; for(let v=a;v<=b+st/2;v+=st) out.push(+v.toFixed(6)); return out;
}
/* Error per point with U as error bars, inside the ±TU band. The previous certificate is a hollow marker, the current one a filled marker. */
function errChart(rows,q,T,y0,y1){

  const band=T!=null?`<rect x="${m.l}" y="${Y(T)}" width="${iw}" height="${Y(-T)-Y(T)}" fill="#EEF0F8"/><line x1="${m.l}" x2="${W-m.r}" y1="${Y(T)}" y2="${Y(T)}" stroke="#8C93A6" stroke-dasharray="4 3"/><line x1="${m.l}" x2="${W-m.r}" y1="${Y(-T)}" y2="${Y(-T)}" stroke="#8C93A6" stroke-dasharray="4 3"/><text x="${W-m.r-4}" y="${Y(T)-4}" text-anchor="end" font-size="10" fill="#5B6272">+TU ${fmtNum(T)}</text><text x="${W-m.r-4}" y="${Y(-T)+12}" text-anchor="end" font-size="10" fill="#5B6272">−TU</text>`:'';
  const mark=(i,e,U,dx,filled,yr,x)=>{ if(e==null) return ''; const cx=X(i)+dx, c=filled?'#3A45B5':'#5184E4';
    const bar=U!=null?`<line x1="${cx}" x2="${cx}" y1="${Y(e+U)}" y2="${Y(e-U)}" stroke="${c}" stroke-width="1.5"/><line x1="${cx-4}" x2="${cx+4}" y1="${Y(e+U)}" y2="${Y(e+U)}" stroke="${c}" stroke-width="1.5"/><line x1="${cx-4}" x2="${cx+4}" y1="${Y(e-U)}" y2="${Y(e-U)}" stroke="${c}" stroke-width="1.5"/>`:'';
    const dot=filled?`<circle cx="${cx}" cy="${Y(e)}" r="5" fill="${c}" stroke="#fff" stroke-width="2"/>`:`<circle cx="${cx}" cy="${Y(e)}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2"/>`;
    return `<g>${bar}${dot}<circle cx="${cx}" cy="${Y(e)}" r="11" fill="transparent"><title>${x.label} · ${yr}: e ${fsg(e)} ${u}, U ${fx(U)} ${u} → |e|+U ${fx(Math.abs(e)+(U||0))}</title></circle></g>`;};
  const marks=rows.map((x,i)=>mark(i,x.e0,x.U0,-9,false,y0,x)+mark(i,x.e1,x.U,9,true,y1,x)).join('');
  const xl=rows.map((x,i)=>`<text x="${X(i)}" y="${H-m.b+16}" text-anchor="middle" font-size="10.5" fill="#1A1A1A">${q==='RH'?`${fmtNum(x.nom)} %`:`${fmtNum(x.nom)} ºC`}</text>${q==='RH'?`<text x="${X(i)}" y="${H-m.b+29}" text-anchor="middle" font-size="9.5" fill="#5B6272">at ${fmtNum(x.atT)} ºC</text>`:''}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${q==='RH'?'Humidity':'Temperature'} error per point, ${y0||''} and ${y1}"><text x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle" font-size="10" fill="#5B6272">e (${u})</text>${band}${grid}${marks}${xl}</svg>`;
}

/* ---------- Excel import ----------
   Reads the F-IM-FM-001 workbook as it is: header row "Inventory Code", rows without a code continue the equipment above
   (extra ranges, axes or channels), and the monthly columns' fill colours: green = done, blue = planned, red = expiry. */
const clean=v=>String(v??'').replace(/\s*\n\s*/g,' / ').replace(/\s+/g,' ').trim();
const isTBD=v=>/^(tbd|tbf)$/i.test(clean(v));

const txt=v=>{const s=clean(v); return isTBD(s)||isNA(s)?'':s};
function toMonth(v){

  const s=clean(v); let m=s.match(/^(\d{1,2})\s*[\/.-]\s*(\d{4})$/); if(m&&+m[1]>=1&&+m[1]<=12) return `${m[2]}-${pad(+m[1])}`;
  m=s.match(/^(\d{4})-(\d{2})/); if(m) return `${m[1]}-${m[2]}`;

}
function toDate(v){

function parsePeriod(v){

}
function canonLab(v){const t=txt(v); if(!t) return ''; const k=norm(t).replace(/\s/g,''); return ({traadelab:'TRADELAB',tradelab:'TRADELAB',endres:'ENDRESS+HAUSER',endress:'ENDRESS+HAUSER',endresshauser:'ENDRESS+HAUSER'})[k]||t.toUpperCase();}

}
const PLAN_COLS=[['ok',h=>h.startsWith('calibration ok')],['code',h=>h==='inventory code'],['period',h=>h.startsWith('calibration period')],['last',h=>h.startsWith('last calibration')],['next',h=>h.startsWith('next calibration')],
  ['desc',h=>h==='description'||h==='equipment description'],['range',h=>h.startsWith('working range')],['points',h=>h.startsWith('calibration point')],['tol',h=>h.startsWith('tolerance')],['brand',h=>h==='brand'],['model',h=>h==='model'],

    const h=norm(G.val(hr,c));
    if(h==='expiration'||h==='programmed'){const mi=MONTHS_EN.indexOf(norm(G.val(hr-1,c,true))), y=num(G.val(hr-2,c,true)); if(mi>=0&&y) monthCols.push({c,m:`${y}-${pad(mi+1)}`}); continue;}

    }
    if(!/^[A-Z]{2,}[- ]?\d+/.test(code)){cur=null; continue;}
    cur={code,r,raw,marks,link:(G.at(r,C.code)||{}).l,points:[]};
    const pt={range:txt(raw.range),points:txt(raw.points),tolerance:txt(raw.tol),detail:''};
    if(pt.range||pt.points||pt.tolerance) cur.points.push(pt);

function buildFromRow(row,sheet,group,out,now){

  let mode=p==='before'?'Before use':typeof p==='number'?'Periodic':next?'Expiry date':'Not required';
  const reserved=!desc&&!txt(raw.brand)&&!txt(raw.model)&&!txt(raw.serial)&&!last&&!next;
  if(reserved) mode='Periodic';
  let id='eq-'+slug(row.code); for(let k=2;out.equipment[id];k++) id=`eq-${slug(row.code)}-${k}`;
  const e={code:row.code,group,description:desc,brand:txt(raw.brand),model:txt(raw.model),serial:txt(raw.serial)===''?'':String(clean(raw.serial)),
    state:reserved?'Reserved':'In use',calMode:mode,periodMonths:typeof p==='number'?p:'',lastCal:['Periodic','Expiry date'].includes(mode)?last:'',nextOverride:'',
    actionType:/^int/i.test(txt(raw.atype))?'Internal':/^ext/i.test(txt(raw.atype))?'External':'',location:/situ/i.test(txt(raw.aloc))?'In situ':/^ext/i.test(txt(raw.aloc))?'External':'',
    duration:txt(raw.adur),lab:canonLab(raw.lab),enac:/^y(es)?$/i.test(txt(raw.enac))?'Yes':/^no$/i.test(txt(raw.enac))?'No':'',price:num(txt(raw.price))??'',
    points:row.points,maint:{required:false,periodMonths:'',last:'',provider:'',notes:''},certUrl:'',notes:'',src:`${sheet}!${row.r+1}`,importNotes:notes,updated:nowIso()};
  if(row.link&&row.link.Target){const t=row.link.Target, abs=/^https?:/i.test(t)?t:S.cfg.certBase+t; if(abs!==certLink(e)) e.certUrl=abs;}
  if(mode==='Periodic'&&!reserved){

    if(!next&&clean(raw.next)&&!isNA(raw.next)&&!isTBD(raw.next)) note(`Next calibration “${clean(raw.next)}” is not a month/year.`);
    const calc=last?addM(last,p):'';

  if(mode==='Periodic'&&last){

const EV_COLS=[['code',h=>h==='inventory code'],['setpoint',h=>h.startsWith('evaluated setpoint')],['obtained',h=>h.startsWith('obtained value')],['test',h=>h.startsWith('related test')],
  ['tuRH',h=>h.startsWith('tolerance of use')&&h.includes('rh')],['tuC',h=>h.startsWith('tolerance of use')],['err',h=>h.startsWith('indication error')],['U',h=>h.startsWith('expanded uncertainty')],
  ['rule',h=>h.startsWith('decision rule')],['conf',h=>h.startsWith('conformity')],['by',h=>/^eval[a-z]* by$/.test(h)],['date',h=>h.startsWith('evaluation date')]];

function parseWorkbook(wb){

const XL_FIELDS=['code','group','description','brand','model','serial','calMode','periodMonths','lastCal','nextOverride','actionType','location','duration','lab','enac','price','points','certUrl','src'];
function importOps(P){

  for(const [id,e] of Object.entries(P.equipment)){
    const cur=DATA.equipment[id];
    if(!cur){ops.push({op:'set',col:'equipment',id,data:e}); st.eqNew++; st.rows.push({e,tag:'new'}); continue;}
    const patch={}; for(const k of XL_FIELDS) if(JSON.stringify(cur[k]??'')!==JSON.stringify(e[k]??'')) patch[k]=e[k];
    const done=new Set((cur.importNotes||[]).filter(n=>n.done).map(n=>n.text)), notes=e.importNotes.map(n=>({...n,done:done.has(n.text)}));
    if(JSON.stringify(notes)!==JSON.stringify(cur.importNotes||[])) patch.importNotes=notes;

function eqHints(){

function saveEq(f){
  const id=dlg.dataset.id, code=String(f.code||'').toUpperCase(), prev=id?DATA.equipment[id]:null;
  if(!code) return formErr('The inventory code is required.');
  if(!f.description) return formErr('The description is required.');
  const clash=IX.eqs.find(x=>x.id!==id&&norm(x.code)===norm(code));
  if(clash&&(!prev||norm(prev.code)!==norm(code))) return formErr(`${code} is already used by ${clash.description}. Use another code (next free: ${nextCode()}).`);
  const mode=f.calMode, per=num(f.periodMonths);
  if(mode==='Periodic'&&f.state!=='Reserved'&&!(per>0)) return formErr('Enter the calibration period in months (12 = 1 year).');
  if(mode==='Expiry date'&&!f.nextOverride) return formErr('Enter the expiry date.');
  if(f.mReq&&!(num(f.mPeriod)>0)) return formErr('Enter the maintenance period in months.');
  const calc=mode==='Periodic'?addM(f.lastCal,per):'';
  const points=[...dlg.querySelectorAll('.pt-row')].map(r=>({range:r.querySelector('[name=pt-range]').value.trim(),points:r.querySelector('[name=pt-points]').value.trim(),tolerance:r.querySelector('[name=pt-tol]').value.trim(),detail:r.querySelector('[name=pt-detail]').value.trim()})).filter(p=>p.range||p.points||p.tolerance||p.detail);
  const data={code,group:f.group,state:f.state,description:f.description,brand:f.brand||'',model:f.model||'',serial:f.serial||'',calMode:mode,
    periodMonths:mode==='Periodic'?per:'',lastCal:['Periodic','Expiry date'].includes(mode)?f.lastCal||'':'',nextOverride:['Periodic','Expiry date'].includes(mode)&&f.nextOverride&&f.nextOverride!==calc?f.nextOverride:'',
    actionType:f.actionType||'',location:f.location||'',duration:f.duration||'',lab:f.lab||'',enac:f.enac||'',price:num(f.price)??'',points,
    maint:{required:!!f.mReq,periodMonths:num(f.mPeriod)??'',last:f.mLast||'',provider:f.mProvider||'',notes:f.mNotes||''},
    validation:{...((prev||{}).validation||{}),standards:[...dlg.querySelectorAll('[name=vstd]:checked')].map(i=>i.value),range:f.vRange||'',usefulZone:f.vZone||'',volume:f.vVolume||'',feedthroughs:f.vFeed||''},certUrl:f.certUrl||'',notes:f.notes||'',updated:nowIso()};
  if(id) return save([{op:'update',col:'equipment',id,data}],`${code} saved.`);
  let nid='eq-'+slug(code); if(DATA.equipment[nid]) nid='eq-'+rid();
  return save([{op:'set',col:'equipment',id:nid,data:{...data,src:'manual',importNotes:[],created:nowIso()}}],`${code} added.`);
}

/* ---------- Storage: one JSON file in the private data repository Polinya-LAB/lab-data (folder calibraciones/) ----------
   Same as Control de ensayos: reading calibraciones.json needs the key (token) of an account with read access; saving needs
   write access; changes made close together are saved as one commit. The key is shared with the other lab apps (same site, same browser storage). */
const REPO={owner:'Polinya-LAB',repo:'lab-data',branch:'main',path:'calibraciones/calibraciones.json'};
const API=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`;
const RAW=`https://raw.githubusercontent.com/${REPO.owner}/${REPO.repo}/${REPO.branch}/${REPO.path}`;
const TOKEN_KEY='pd-gh-token';
const GH={token:'',login:null,push:false,invalid:false,saving:false};
try{GH.token=localStorage.getItem(TOKEN_KEY)||'';}catch(e){}
S.ro=true;
const remote={data:null,sha:null,etag:null};
let flushTimer=null, flushing=null;
const pendingOps=[];
/* Local test mode: the data comes from local-data.js and is kept in this browser; nothing is read from or written to GitHub. */
const LOCAL=!!window.CAL_LOCAL, LS_LOCAL='cal.local.data';
/* Preview copy in new-projects: reads the real data from lab-data with the GitHub key but never writes to it.
   Changes stay in this page until it is reloaded. Remove this line in the copy that goes to management-tools. */
const PREVIEW=!LOCAL;
if(LOCAL) S.ro=false;
const emptyData=()=>Object.fromEntries(COLS.map(c=>[c,{}]));
const normData=x=>{const o=emptyData(); for(const c of COLS) if(x&&x[c]&&typeof x[c]==='object') o[c]=x[c]; return o;};
const b64encode=str=>{const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin);};
const b64decode=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ghFetch=(url,opts={})=>fetch(url,{cache:'no-store',...opts,headers:{Accept:'application/vnd.github+json',...(GH.token?{Authorization:`Bearer ${GH.token}`}:{}),...(opts.headers||{})}});
const httpError=res=>{const limited=res.status===429||(res.status===403&&res.headers.get('x-ratelimit-remaining')==='0'); return {code:res.status===401?'auth':limited?'rate':(res.status===403||res.status===404)?'forbidden':'unavailable',status:res.status};};
function errMsg(e){const c=e&&e.code; if(c==='not_granted'||c==='forbidden') return 'You cannot change data: connect GitHub with an account that has write access to the repository.'; if(c==='auth') return 'Your GitHub key is no longer valid. Connect GitHub again with a new key.'; if(c==='conflict') return 'Someone else saved at the same time. Your change was not saved; try again.'; if(c==='rate') return 'GitHub is limiting requests right now. Wait a minute and try again.'; if(c==='unavailable') return 'Could not reach GitHub. Check your connection and try again.'; return 'Could not save: '+(e&&e.message||e)}

async function fetchApi(useEtag){
  const res=await ghFetch(`${API}/contents/${REPO.path}?ref=${REPO.branch}`,useEtag&&remote.etag?{headers:{'If-None-Match':remote.etag}}:{});
  if(res.status===304) return null;
  if(res.status===404) throw {code:'private',status:404};
  if(!res.ok) throw httpError(res);
  const j=await res.json(); let text;
  if(j.content) text=b64decode(j.content);
  else{const blob=await ghFetch(`${API}/git/blobs/${j.sha}`); if(!blob.ok) throw httpError(blob); text=b64decode((await blob.json()).content);}
  return {data:normData(JSON.parse(text)),sha:j.sha,etag:res.headers.get('etag')};
}
async function fetchRaw(){
  const res=await fetch(`${RAW}?t=${Date.now()}`,{cache:'no-store'});
  if(res.status===404) throw {code:'private',status:404};
  if(!res.ok) throw httpError(res);
  return {data:normData(await res.json()),sha:null,etag:null};
}
/* Applies writes to a copy of the data. An update to a document someone else deleted is skipped. */
function applyOps(data,ops){
  for(const o of ops){const c=data[o.col]||(data[o.col]={});
    if(o.op==='set') c[o.id]=clone(o.data);
    else if(o.op==='update'){ if(c[o.id]) Object.assign(c[o.id],clone(o.data)); }
    else if(o.op==='delete') delete c[o.id];}
  return data;
}
/* Certificates from SharePoint: a separate file in the same repository, read only. */
let CERTS={}; const certsRemote={etag:null};
async function loadCerts(){
  if(LOCAL){CERTS=window.CAL_LOCAL_CERTS||{}; return;}
  if(!GH.token||GH.invalid) return;
  try{
    const res=await ghFetch(`${API}/contents/calibraciones/certificados.json?ref=${REPO.branch}`,certsRemote.etag?{headers:{'If-None-Match':certsRemote.etag}}:{});
    if(res.status===304||!res.ok) return;
    const j=await res.json(); let text=j.content?b64decode(j.content):null;
    if(text==null){const blob=await ghFetch(`${API}/git/blobs/${j.sha}`); if(!blob.ok) return; text=b64decode((await blob.json()).content);}
    CERTS=(JSON.parse(text)||{}).certificates||{}; certsRemote.etag=res.headers.get('etag');
  }catch(e){}
}
function recompute(){ DATA=remote.data?applyOps(clone(remote.data),pendingOps.flat()):null; }
function commitMessage(ops){
  const base=remote.data||emptyData(), cur=(o)=>({...(base[o.col]||{})[o.id],...(o.data||{})});
  const code=id=>((base.equipment||{})[id]||{}).code||id;
  const label=o=>{const d=cur(o); if(o.col==='equipment') return d.code||o.id; if(o.col==='calibrations') return `${code(d.equipmentId)} ${d.month||''}`.trim(); if(o.col==='config') return 'settings'; return code(d.equipmentId);};
  const names={equipment:'equipment',calibrations:'calibration',evaluations:'TU evaluation',maintenance:'maintenance',config:'settings'};
  if(ops.length===1){const o=ops[0], verb=o.op==='delete'?'delete':o.op==='set'&&!(base[o.col]||{})[o.id]?'add':'update';
    return `Plan de calibraciones: ${verb} ${o.col==='config'?'settings':`${names[o.col]} ${label(o)}`}`;}
  const n={}; ops.forEach(o=>n[o.col]=(n[o.col]||0)+1);
  const plural={equipment:'equipment',calibrations:'calibrations',evaluations:'TU evaluations',maintenance:'maintenance entries',config:'settings'};
  return `Plan de calibraciones: ${ops.length} changes (${Object.entries(n).map(([c,k])=>`${k} ${plural[c]||c}`).join(', ')})`;
}
async function commitOps(ops){
  for(let i=0;i<4;i++){
    const cur=await fetchApi(false), next=applyOps(clone(cur.data),ops);
    const body={message:commitMessage(ops),branch:REPO.branch,content:b64encode(JSON.stringify(next,null,1)+'\n')}; if(cur.sha) body.sha=cur.sha;
    const res=await ghFetch(`${API}/contents/${REPO.path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){const j=await res.json(); Object.assign(remote,{data:next,sha:j.content.sha,etag:null}); return;}
    if(res.status!==409&&res.status!==422) throw httpError(res);
    await new Promise(r=>setTimeout(r,500+Math.random()*800));
  }
  throw {code:'conflict'};
}
/* Writes show up at once on screen and are saved together, one commit per burst of changes. */
function save(ops,msg){
  if(!ops.length) return true;
  if(LOCAL){applyOps(remote.data,ops); try{localStorage.setItem(LS_LOCAL,JSON.stringify(remote.data));}catch(e){} recompute(); render(); if(msg) toast(msg); return true;}
  if(PREVIEW){applyOps(remote.data,ops); recompute(); render(); if(msg) toast(msg+' (preview: not saved to GitHub)'); return true;}
  if(S.ro||!GH.push||GH.invalid){toast(errMsg({code:'not_granted'})); return null;}
  pendingOps.push(ops); recompute(); render(); if(msg) toast(msg);
  clearTimeout(flushTimer); flushTimer=setTimeout(flushOps,700);
  return true;
}
async function flushOps(){
  if(flushing) await flushing;
  if(!pendingOps.length) return;
  const batch=pendingOps.splice(0,pendingOps.length);
  GH.saving=true; renderGh();
  flushing=(async()=>{
    try{await commitOps(batch.flat());}
    catch(err){ if(err.code==='auth'){GH.invalid=true; GH.push=false; S.ro=true;} toast(errMsg(err)); }
    finally{flushing=null; GH.saving=!!pendingOps.length; recompute(); render();}
  })();
  return flushing;
}
async function refresh(){
  if(LOCAL){
    if(!remote.data){let s=null; try{s=JSON.parse(localStorage.getItem(LS_LOCAL)||'null');}catch(e){} remote.data=normData(s||clone(window.CAL_LOCAL));}
    await loadCerts(); recompute(); render(); return;
  }
  if(pendingOps.length||flushing||(PREVIEW&&remote.data)) return;
  try{
    const r=GH.token&&!GH.invalid?await fetchApi(true):await fetchRaw();
    const n0=Object.keys(CERTS).length, e0=certsRemote.etag; await loadCerts();
    if(!r&&(certsRemote.etag!==e0||Object.keys(CERTS).length!==n0)) render();
    if(r){Object.assign(remote,r); if(PREVIEW) S.ro=false; recompute(); render();}
    S.noDb=false; S.privateData=false;
  }catch(err){
    if(err.code==='auth'){GH.invalid=true; GH.push=false; S.ro=true; return refresh();}
    if(!DATA){S.noDb=true; S.privateData=err.code==='private'||err.code==='forbidden'; render();}
  }
}
async function connectGh(t){
  const h={Accept:'application/vnd.github+json',Authorization:`Bearer ${t}`};
  const [u,r]=await Promise.all([fetch('https://api.github.com/user',{headers:h,cache:'no-store'}),fetch(API,{headers:h,cache:'no-store'})]);
  if(u.status===401||r.status===401) throw {code:'auth'};
  if(!u.ok) throw httpError(u); if(!r.ok) throw httpError(r);
  const user=await u.json(), repo=await r.json();
  Object.assign(GH,{token:t,login:user.login,push:!!(repo.permissions&&repo.permissions.push),invalid:false});
  S.ro=PREVIEW?!remote.data:!GH.push;
}
function disconnectGh(){Object.assign(GH,{token:'',login:null,push:false,invalid:false}); S.ro=true; try{localStorage.removeItem(TOKEN_KEY);}catch(e){} remote.etag=null; dlg.close(); render(); toast('Disconnected from GitHub. This browser no longer has the key.');}
function renderGh(){
  const b=$('#btn-gh'); if(!b) return;
  if(LOCAL){b.className='gh on'; b.querySelector('span').textContent='Local test data'; b.title='Local test mode: nothing is sent to GitHub.'; document.body.classList.remove('ro'); return;}
  b.className='gh '+(GH.invalid?'bad':GH.saving?'busy':GH.login&&GH.push?'on':'');
  b.querySelector('span').textContent=GH.invalid?'GitHub key expired':GH.saving?'Saving…':GH.login?GH.login:'Connect GitHub';
  if(PREVIEW&&GH.login) b.className='gh busy';
  b.title=PREVIEW?'Preview: the data is read from GitHub, changes are not saved.':GH.login?(GH.push?'Connected with write access. Changes are saved as commits.':'Connected, but this account cannot edit the repository.'):'Connect GitHub to see and change the calibration plan';
  document.body.classList.toggle('ro',!!S.ro);
}
function openGh(){
  dlg.dataset.kind='gh'; dlg.dataset.id=''; dlg.classList.add('narrow');
  const body=`${GH.login?`<p class="note">Connected as <b>${esc(GH.login)}</b>${GH.push?' with write access.':', but this account cannot edit the repository.'}</p>`:''}
  <ol class="guide">
    <li>Create an access key in GitHub: <a href="https://github.com/settings/tokens/new?scopes=repo&amp;description=Laboratorio%20Polinya" target="_blank" rel="noopener">open the form</a>. The <span class="mono">repo</span> permission is already ticked (needed because the lab data is private); choose an expiry and press <i>Generate token</i>.</li>
    <li>Copy the key and paste it here.</li>
  </ol>
  <div class="field"><label for="gh-token">Access key (token)</label><input id="gh-token" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"></div>
  <p class="note">The key is kept only in this browser and is shared with the other lab apps. Your GitHub account must have access to the data repository <span class="mono">${REPO.owner}/${REPO.repo}</span>: Read to view, Write to edit. Every change is saved as a commit, so the history shows who changed what.</p>`;
  dlg.innerHTML=`<form class="dlg-form" id="dlg-form" novalidate><header class="dlg-h"><div><p class="eyebrow">Access</p><h2>Connect GitHub</h2></div><button type="button" class="icon-btn" data-act="close" aria-label="Close">×</button></header>
  <div class="dlg-body">${body}<div id="f-err" class="form-err" hidden></div></div>
  <footer class="dlg-f">${GH.token?'<button type="button" class="btn ghost danger" data-act="gh-off">Disconnect</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn primary gh-ok" type="submit">Connect</button></footer></form>`;
  if(!dlg.open) dlg.showModal(); $('#gh-token').focus();
}
async function saveGh(){
  const t=($('#gh-token').value||'').trim(); if(!t) return formErr('Paste the access key.');
  const btn=dlg.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent='Checking…';
  try{
    await connectGh(t); try{localStorage.setItem(TOKEN_KEY,t);}catch(e){}
    remote.etag=null; S.noDb=false; await refresh(); dlg.close(); render();
    toast(GH.push?`Connected as ${GH.login}. You can now edit.`:`Connected as ${GH.login}, but this account cannot edit the repository.`);
  }catch(err){ btn.disabled=false; btn.textContent='Connect'; formErr(err.code==='auth'?'That key is not valid or has expired.':err.code==='forbidden'?'That key cannot see the repository.':'Could not reach GitHub. Check your connection.'); }
}
const json=()=>JSON.stringify(DATA,null,1)+'\n';
function download(){
  const url=URL.createObjectURL(new Blob([json()],{type:'application/json'})), a=document.createElement('a');
  a.href=url; a.download=`calibraciones_${todayIso()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
window.addEventListener('beforeunload',e=>{ if(pendingOps.length||flushing){e.preventDefault(); e.returnValue='';} });

/* ---------- Events ---------- */
function setView(v){S.view=v; try{localStorage.setItem('cal.view',v)}catch(e){} if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); render(); window.scrollTo(0,0);}
document.addEventListener('click',async ev=>{
  const op=ev.target.closest('[data-open]'); if(op){const d=document.getElementById(op.dataset.open); if(d) d.open=true; return;}
  if(ev.target.closest('a[href]')||ev.target.closest('input[data-tog],select[data-tol]')) return;
  const v=ev.target.closest('[data-view]'); if(v){setView(v.dataset.view); return;}
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a==='eq') openEq(id);
  else if(a==='eq-new') openEq(null);
  else if(a==='cal-new'){const i=id&&IX.info.get(id); if(i&&i.planned) openCal(i.planned.id,{status:'Done',month:mStr(nowIdx())}); else openCal(null,{equipmentId:id||''});}
  else if(a==='cal-plan'){const i=IX.info.get(id); openCal(null,{equipmentId:id,status:'Planned',month:i&&i.due?i.due:mStr(nowIdx()+1)});}
  else if(a==='cal-edit') openCal(id);
  else if(a==='ev-new') openEv(null,{equipmentId:id||''});
  else if(a==='ev-edit') openEv(id);
  else if(a==='mt-new') openMt(null,{equipmentId:id||''});
  else if(a==='mt-edit') openMt(id);
  else if(a==='close') dlg.close();
  else if(a==='del') deleteFromDialog(t);
  else if(a==='pt-add'){$('#pt-list').insertAdjacentHTML('beforeend',ptRow({})); $('#pt-list').lastElementChild.querySelector('input').focus();}
  else if(a==='pt-del'){const r=t.closest('.pt-row'); if($('#pt-list').children.length>1) r.remove(); else r.querySelectorAll('input').forEach(i=>i.value='');}
  else if(a==='note-done'){const e=DATA.equipment[id]; const notes=clone(e.importNotes||[]); if(notes[+t.dataset.n]) notes[+t.dataset.n].done=true; save([{op:'update',col:'equipment',id,data:{importNotes:notes}}],'Marked as reviewed.'); if(dlg.open&&dlg.dataset.kind==='eq') openEq(id);}
  else if(a==='sort'){const st=S.sort.eq; if(st.k===t.dataset.k) st.dir=-st.dir; else {st.k=t.dataset.k; st.dir=1;} render();}
  else if(a==='kpi'){const k=t.dataset.k; if(k==='maint') return setView('maintenance'); if(k==='review') return setView('review'); S.f={group:[],lab:[],status:[k]}; S.q=''; setView('equipment');}
  else if(a==='clear-f'){S.f={group:[],status:[],lab:[]}; S.q=''; render();}
  else if(a==='clear-calf'){S.calf={status:[],year:[]}; S.q=''; render();}
  else if(a==='fchip'){const arr=S[t.dataset.scope][t.dataset.k], v=t.dataset.v, i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); render();}
  else if(a==='cell'){if(S.ro&&!(IX.recs.get(id)||[]).some(c=>c.month===t.dataset.m)) return; const ms=t.dataset.m, here=(IX.recs.get(id)||[]).filter(c=>c.month===ms); if(here.length) openCal((here.find(c=>c.status==='Planned')||here[0]).id); else openCal(null,{equipmentId:id,status:mIdx(ms)>nowIdx()?'Planned':'Done',month:ms});}
  else if(a==='plan-nav'){const d=+t.dataset.d, y=Math.floor(nowIdx()/12); S.plan.start=d===0?null:(S.plan.start??y)+d; render();}
  else if(a==='plan-span'){S.plan.span=+t.dataset.s; try{localStorage.setItem('cal.span',S.plan.span)}catch(e){} render();}
  else if(a==='do-import'){const {ops,st}=S.imp; S.imp=null; save(ops,`Import finished: ${st.eqNew} new and ${st.eqUpd} updated equipment, ${st.calNew} calibrations, ${st.evNew} evaluations.`); setView('overview');}
  else if(a==='cancel-import'){S.imp=null; render();}
  else if(a==='export-xlsx') exportXlsx();
  else if(a==='settings') openSettings();
  else if(a==='download') download();
  else if(a==='gh'){ if(LOCAL) toast('Local test mode: the data stays in this browser and GitHub is not used.'); else openGh(); }
  else if(a==='local-reset'){try{localStorage.removeItem(LS_LOCAL);}catch(e){} remote.data=null; await refresh(); toast('Test data reset.');}
  else if(a==='sheet'){S.sheet=id; dlg.close(); setView('sheets');}
  else if(a==='print'){const e=eqById(S.sheet), t=document.title; if(e) document.title=`${e.code}-VAL ${todayIso()}`; window.print(); document.title=t;}
  else if(a==='cert-reg'){const ct=CERTS[t.dataset.k]; if(ct) openCal(null,{equipmentId:id,status:'Done',month:String(ct.calDate||'').slice(0,7)||mStr(nowIdx()),lab:ct.lab||'',certRef:ct.certRef||'',certificate:true,spKey:t.dataset.k});}
  else if(a==='res-add'){$('#res-list').insertAdjacentHTML('beforeend',resRow({q:'T'})); $('#res-list').lastElementChild.querySelector('input').focus();}
  else if(a==='res-del') t.closest('.res-row').remove();
  else if(a==='gh-off') disconnectGh();
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value; const pos=ev.target.selectionStart; render(); const q=$('#q'); if(q){q.focus(); try{q.setSelectionRange(pos,pos)}catch(e){}}}
  else if(dlg.open&&dlg.contains(ev.target)){eqHints(); calHints(); evHints();}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='file-xlsx') onXlsx(el.files[0]);
  else if(el.id==='plan-all'){S.plan.all=el.checked; render();}
  else if(el.id==='sheet-pick'){S.sheet=el.value; render();}
  else if(el.dataset.tog){const c=DATA.calibrations[el.dataset.id]; save([{op:'update',col:'calibrations',id:el.dataset.id,data:{[el.dataset.tog]:el.checked,updated:nowIso()}}],`${eqById(c.equipmentId)?.code||''} ${fmtM(c.month)}: ${el.dataset.tog==='label'?'label':'certificate'} ${el.checked?'ticked':'unticked'}.`);}
  else if(el.dataset.tol){const c=DATA.calibrations[el.dataset.tol]; save([{op:'update',col:'calibrations',id:el.dataset.tol,data:{inTolerance:el.value,updated:nowIso()}}],`${eqById(c.equipmentId)?.code||''} ${fmtM(c.month)}: in tolerance = ${el.value||'not checked'}.`);}
  else if(dlg.open&&dlg.contains(el)){eqHints(); calHints(); evHints();}
});
document.addEventListener('submit',ev=>{ if(ev.target.id!=='dlg-form') return; ev.preventDefault(); if(dlg.dataset.kind==='gh') saveGh(); else saveDialog(); });
const dzOf=ev=>ev.target.closest&&ev.target.closest('[data-dz]');
document.addEventListener('dragover',ev=>{const z=dzOf(ev); if(z&&ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files')){ev.preventDefault(); z.classList.add('over');}});
document.addEventListener('dragleave',ev=>{const z=dzOf(ev); if(z) z.classList.remove('over');});
document.addEventListener('drop',ev=>{const z=dzOf(ev); if(z&&ev.dataTransfer.files.length){ev.preventDefault(); z.classList.remove('over'); onXlsx(ev.dataTransfer.files[0]);}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(VIEWS.some(x=>x[0]===h)&&h!==S.view) setView(h);});

/* ---------- Boot ---------- */
render();
(async()=>{
  if(GH.token&&!LOCAL){ try{await connectGh(GH.token);}catch(err){ if(err.code==='auth') GH.invalid=true; } }
  await refresh(); render();
  setInterval(()=>{ if(!document.hidden&&!dlg.open) refresh(); }, GH.token?30000:60000);
})();
</script>
</body>
</html>
