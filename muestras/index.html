<!-- Same engine as Control de ensayos and Ocupación (app.js, app.css); <body data-app="samples"> picks the Muestras app. -->
<body data-app="samples">

<header class="top">
  <div class="top-in">
    <div class="brand"><a class="home" href="../">← Laboratorio Polinyà</a><div class="row1"><h1>Muestras</h1><span class="tag">SAMPLES</span><span class="tag proto">PREVIEW</span></div></div>
    <button type="button" class="gh" id="btn-gh" data-act="gh"><i></i><span>Connect GitHub</span></button>
    <button class="btn ghost" id="btn-install" type="button" hidden>⤓ Instalar app</button>
    <button class="btn primary" id="btn-new" data-act="new" hidden>+ New test</button>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </div>
</header>
<main id="view"><div class="empty"><h3>Loading lab data…</h3></div></main>
<dialog id="dlg"></dialog>
<datalist id="qtp-list"></datalist>
<datalist id="smp-plr-list"></datalist>
<datalist id="smp-loc-list"></datalist>
<div id="toast" hidden></div>
<div id="smp-print"></div>
<style id="smp-page-size">@page{size:89mm 36mm;margin:0}</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<!-- Preview only: example data. Not in the copy that goes to management-tools. -->
<script src="demo-data.js?v=20261029"></script>
<script src="app.js?v=20261029"></script>
<script>
/* Desktop app (PWA): Chrome or Edge offer to install it from the published page (https). The service worker keeps the
   app files so it opens without connection; the app always reads lab data from GitHub. */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
(()=>{let ev=null; const b=document.getElementById('btn-install');
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); ev=e; b.hidden=false;});
  b.addEventListener('click',async()=>{if(!ev) return; ev.prompt(); await ev.userChoice; ev=null; b.hidden=true;});
  window.addEventListener('appinstalled',()=>{b.hidden=true;});})();
</script>
</body>
</html>
